<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="dark light">
  <title>Simple Shortcuts</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <svg class="icon-definitions" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="icon-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></symbol>
    <symbol id="icon-settings" viewBox="0 0 24 24"><path d="M3 7h3m6 0h9M3 17h9m6 0h3"/><circle cx="9" cy="7" r="3"/><circle cx="15" cy="17" r="3"/></symbol>
    <symbol id="icon-save" viewBox="0 0 24 24"><path d="M5 3h12l4 4v14H3V3h2Zm2 0v7h10V3M7 21v-7h10v7"/></symbol>
    <symbol id="icon-filter" viewBox="0 0 24 24"><path d="M3 5h18l-7 8v6l-4 2v-8Z"/></symbol>
    <symbol id="icon-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></symbol>
    <symbol id="icon-export" viewBox="0 0 24 24"><path d="M12 3v12m-4-4 4 4 4-4M4 16v5h16v-5"/></symbol>
    <symbol id="icon-import" viewBox="0 0 24 24"><path d="M12 16V4m-4 4 4-4 4 4M4 16v5h16v-5"/></symbol>
    <symbol id="icon-pause" viewBox="0 0 24 24"><path d="M7 5v14M17 5v14"/></symbol>
    <symbol id="icon-volume" viewBox="0 0 24 24"><path d="M11 4 6 8H3v8h3l5 4ZM15 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/></symbol>
    <symbol id="icon-muted" viewBox="0 0 24 24"><path d="M11 4 6 8H3v8h3l5 4ZM16 9l5 6m0-6-5 6"/></symbol>
    <symbol id="icon-revoke" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3M3 3l18 18"/></symbol>
  </svg>
  <header>
    <img src="logo48.png" width="28" height="28" alt="">
    <h1>Simple Shortcuts</h1>
    <div class="header-actions">
      <button id="pauseAll" class="icon-button" type="button" title="Pause all media (may request site access)" aria-label="Pause all media"><svg><use href="#icon-pause"/></svg><span class="button-label">Pause</span></button>
      <button id="manageShortcuts" class="icon-button" type="button" title="Manage keyboard shortcuts" aria-label="Manage keyboard shortcuts"><svg><use href="#icon-settings"/></svg><span class="button-label">Edit keys</span></button>
    </div>
  </header>
  <div id="status" role="status" aria-live="polite" hidden></div>
  <div class="search-box"><svg aria-hidden="true"><use href="#icon-search"/></svg><input id="search" type="search" aria-label="Search shortcuts" placeholder="Search" autocomplete="off"></div>
  <section class="memory-section" aria-label="Shortcut memory">
    <p id="memorySummary" role="status">Loading…</p>
    <div class="memory-actions">
      <button id="rememberShortcuts" class="icon-button" type="button" disabled title="Remember current shortcuts" aria-label="Remember current shortcuts"><svg><use href="#icon-save"/></svg><span class="button-label">Save</span></button>
      <label class="icon-button filter-button" title="Show missing or changed only"><input id="onlyDifferences" type="checkbox" aria-label="Show missing or changed only"><svg aria-hidden="true"><use href="#icon-filter"/></svg><span class="button-label">Changes</span></label>
      <button id="moreTools" class="icon-button" type="button" title="Backup options" aria-label="Backup options" aria-expanded="false" aria-controls="backupTools"><svg><use href="#icon-more"/></svg><span class="button-label">Backup</span></button>
    </div>
  </section>
  <div id="backupTools" hidden>
    <label id="snapshotLabel" class="sr-only" for="snapshotPlatform" hidden>Saved platform</label>
    <select id="snapshotPlatform" aria-label="Saved platform" hidden></select>
    <button id="exportShortcuts" class="icon-button" type="button" disabled title="Export shortcut backup" aria-label="Export shortcut backup"><svg><use href="#icon-export"/></svg><span class="button-label">Export</span></button>
    <button id="importShortcuts" class="icon-button" type="button" disabled title="Import shortcut backup" aria-label="Import shortcut backup"><svg><use href="#icon-import"/></svg><span class="button-label">Import</span></button>
    <button id="revokeMedia" class="icon-button" type="button" title="Remove media site access" aria-label="Remove media site access" hidden><svg><use href="#icon-revoke"/></svg><span class="button-label">Revoke media</span></button>
    <input id="backupFile" type="file" accept=".json,application/json" hidden>
  </div>
  <div id="replaceSnapshot" hidden>
    <p id="replaceSummary"></p>
    <div><button id="confirmSnapshot" type="button">Replace</button><button id="cancelSnapshot" type="button">Cancel</button></div>
  </div>
  <main id="shortcutsContainer" aria-label="Shortcuts"><p class="hint">Loading…</p></main>
  <section id="audioSection" class="audio-section" aria-label="Audio tabs" hidden>
    <h2>Audio</h2>
    <div id="audioTabs"></div>
  </section>
  <script src="command-errors.js"></script>
  <script src="shortcut-ui.js"></script>
  <script src="shortcut-memory.js"></script>
  <script src="popup.js"></script>
</body>
</html>
